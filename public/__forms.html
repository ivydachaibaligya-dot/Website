<!DOCTYPE html>
<html>
  <head>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!-- Deploy-time form definition for Netlify Forms. Used by src/components/sections/QuoteRequestForm.tsx. -->
    <form name="quote-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="quote-request" />
      <input name="fullName" type="text" />
      <input name="businessName" type="text" />
      <input name="email" type="email" />
      <input name="country" type="text" />
      <input name="services" type="text" />
      <input name="schedule" type="text" />
      <input name="billing" type="text" />
      <input name="hoursPerDay" type="text" />
      <input name="daysPerWeek" type="text" />
      <input name="weeklyHours" type="text" />
      <input name="monthlyHours" type="text" />
      <input name="estimatedRate" type="text" />
      <input name="estimatedWeeklyCost" type="text" />
      <input name="estimatedMonthlyCost" type="text" />
      <input name="budget" type="text" />
      <textarea name="requirements"></textarea>
      <input name="bot-field" />
      <input name="consent" type="text" />
    </form>
  </body>
</html>
